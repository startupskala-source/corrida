<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Passada</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body data-view="viewRun">
<header>
  <h1>PASSADA</h1>
  <div id="gps"><i></i><span>GPS desligado</span></div>
</header>
<nav class="tabs">
  <button class="tab on" data-view="viewRun">Correr</button>
  <button class="tab" data-view="viewHistory">Histórico</button>
</nav>
<div id="diag" class="diag"></div>

<main id="viewRun" class="view">
  <div class="big">
    <div class="lbl">Tempo</div>
    <div id="time">00:00</div>
  </div>

  <div class="grid">
    <div class="card"><div class="lbl">Distância</div><div class="val" id="dist">0,00<small>km</small></div></div>
    <div class="card hl"><div class="lbl">Pace atual</div><div class="val" id="paceNow">--:--<small>/km</small></div></div>
    <div class="card"><div class="lbl">Pace médio</div><div class="val" id="paceAvg">--:--<small>/km</small></div></div>
    <div class="card"><div class="lbl">Velocidade</div><div class="val" id="speed">0,0<small>km/h</small></div></div>
    <div class="card"><div class="lbl">Km atual</div><div class="val" id="paceLap">--:--<small>/km</small></div></div>
    <div class="card"><div class="lbl">Ritmo (passos)</div><div class="val" id="cadence">--<small>spm</small></div></div>
  </div>

  <div id="rhythm"><div id="rhythmBar"></div></div>
  <div id="rhythmTxt"></div>

  <div id="mapBox">
    <div id="map"></div>
    <div class="map-strip">
      <div><small>Tempo</small><b id="mfTime">00:00</b></div>
      <div><small>Km</small><b id="mfDist">0,00</b></div>
      <div><small>Pace</small><b id="mfPace">--:--</b></div>
    </div>
    <div class="map-btns">
      <button class="icon-btn" id="btnCenter" title="Centralizar em mim">◎</button>
      <button class="icon-btn" id="btnFull" title="Mapa em tela cheia">⛶</button>
    </div>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="optVoice" checked> Aviso por voz a cada km</label>
  </div>

  <h2>Parciais por km</h2>
  <div id="splitsWrap"><div class="empty">Os parciais aparecem a cada quilômetro.</div></div>
</main>

<main id="viewHistory" class="view hidden">
  <div class="grid three" id="histTotals"></div>
  <h2>Corridas</h2>
  <div id="historyList"></div>
</main>

<section id="viewSummary" class="hidden"></section>

<footer>
  <button id="btnStart">INICIAR</button>
  <button id="btnPause" class="hidden">PAUSAR</button>
  <button id="btnStop" class="hidden">FINALIZAR</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/map.js?v=3"></script>
<script src="js/store.js?v=3"></script>
<script src="js/history.js?v=3"></script>
<script src="js/tracker.js?v=3"></script>
</body>
</html>
